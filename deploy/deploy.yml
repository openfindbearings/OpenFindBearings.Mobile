apiVersion: apps/v1
kind: Deployment
metadata:
  name: openfindbearings-mobile
  namespace: openfindbearings
  labels:
    app: openfindbearings-mobile
spec:
  # 改动说明（2026-09-29）：GHCR 跨境拉取慢，默认 600s 判死，调到 1200s 与 deploy 脚本 20m 超时对齐
  progressDeadlineSeconds: 1200
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: openfindbearings-mobile
  template:
    metadata:
      labels:
        app: openfindbearings-mobile
    spec:
      containers:
      - name: openfindbearings-mobile
        image: ghcr.io/openfindbearings/openfindbearings-mobile:latest
        ports:
        - containerPort: 8080

        # 改动说明：环境变量分为 ConfigMap（非敏感）和 Secret（敏感）两部分注入
        envFrom:
        - configMapRef:
            name: openfindbearings-mobile-config
        - secretRef:
            name: openfindbearings-mobile-secrets

        livenessProbe:
          httpGet:
            path: /health/live
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: openfindbearings-mobile
  namespace: openfindbearings
spec:
  selector:
    app: openfindbearings-mobile
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openfindbearings-mobile-ingress
  namespace: openfindbearings
  labels:
    name: openfindbearings-mobile-ingress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    acme.cert-manager.io/http01-edit-in-place: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
      - <your-bff-domain>
    secretName: <your-bff-domain>-tls

  rules:
  - host: "<your-bff-domain>"
    http:
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
               name: openfindbearings-mobile
               port:
                 number: 80
