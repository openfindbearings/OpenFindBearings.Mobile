name: Build Mobile BFF

on:
  # 改动说明（2026-10-25 省 Actions 额度）：只保留 PR 触发（PR 检查已覆盖合并结果），
  #   去掉 push——dev→main 的 PR 不再同时命中 push(dev) 与 pull_request(main) 跑两遍，合并后也不重复构建
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  PROJECT_PATH: 'src/OpenFindBearings.Mobile/OpenFindBearings.Mobile.csproj'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6.0.2

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore ${{ env.PROJECT_PATH }}

    - name: Build
      run: dotnet build ${{ env.PROJECT_PATH }} --no-restore --configuration Release

    - name: Test (placeholder)
      run: echo "No test project yet"
