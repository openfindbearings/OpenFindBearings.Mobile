name: Deploy Mobile BFF

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag'
        required: false
        default: 'latest'
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: openfindbearings/openfindbearings-mobile
  DOTNET_VERSION: '10.0.x'
  PROJECT_PATH: 'src/OpenFindBearings.Mobile/OpenFindBearings.Mobile.csproj'
  NAMESPACE: openfindbearings
  DEPLOYMENT: openfindbearings-mobile
  CONTAINER: openfindbearings-mobile

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      docker_tag: ${{ steps.set_tag.outputs.docker_tag }}

    steps:
    - uses: actions/checkout@v6.0.2

    - name: Set tag
      id: set_tag
      run: |
        if [ "${{ github.event_name }}" = "release" ]; then
          echo "docker_tag=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
        elif [ -n "${{ github.event.inputs.tag }}" ]; then
          echo "docker_tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
        else
          echo "docker_tag=latest" >> $GITHUB_OUTPUT
        fi

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: .
        file: Dockerfile
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.set_tag.outputs.docker_tag }}
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
    - name: Set up kubectl
      uses: azure/setup-kubectl@v4

    - name: Configure kubeconfig
      run: |
        mkdir -p $HOME/.kube
        echo "${{ secrets.KUBECONFIG_CONTENT }}" > $HOME/.kube/config
        chmod 600 $HOME/.kube/config

    - name: Update image
      run: |
        TAG=${{ needs.build-and-push.outputs.docker_tag }}
        kubectl set image deployment/${{ env.DEPLOYMENT }} \
          ${{ env.CONTAINER }}=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${TAG} \
          -n ${{ env.NAMESPACE }}

    - name: Wait for rollout
      run: |
        kubectl rollout status deployment/${{ env.DEPLOYMENT }} \
          -n ${{ env.NAMESPACE }} \
          --timeout=10m

  # 镜像保留策略（open-core 基建，2026-09-29）：发布成功后仅保留最近 5 个镜像版本
  # （滚动在用的 latest/当前 tag 天然在列），防 GHCR 存储无界累积；权限复用仓库自带
  # GITHUB_TOKEN 的 packages:write 无需新 secret；单架构构建（未声明 platform），
  # 一次推送=一个版本条目，不涉及多架构子 manifest 误删问题
  cleanup-old-images:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: 清理 GHCR 旧镜像版本（保留最近 5 个）
        # 改动说明（2026-09-29）：GITHUB_TOKEN 仅能删本仓库关联推送的版本，历史遗留（旧仓库名时期推送）
        # 版本会 403 Resource not accessible——不阻塞发布，余量在 org Packages 网页端手动清
        continue-on-error: true
        uses: actions/delete-package-versions@v5
        with:
          package-name: 'openfindbearings-mobile'
          package-type: container
          min-versions-to-keep: 5
          token: ${{ secrets.GITHUB_TOKEN }}
